# KoobD over https (port 443 in the container, 8443 on this computer).
# Browsers only allow the microphone - speaking practice - on secure
# addresses, so tablets on the classroom Wi-Fi use https://<this PC>:8443.
# The certificate is made by docker/apache/start.sh from a small "KoobD Local"
# certificate authority; each tablet trusts it once by installing
# /koobd-ca.crt (only that public certificate is served, never a key).
<VirtualHost *:443>
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /etc/koobd-certs/koobd-server.crt
    SSLCertificateKeyFile /etc/koobd-certs/koobd-server.key
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

Alias /koobd-ca.crt /etc/koobd-certs/koobd-ca.crt
<Directory /etc/koobd-certs>
    Require all denied
    <Files "koobd-ca.crt">
        Require all granted
        ForceType application/x-x509-ca-cert
        Header set Content-Disposition "attachment; filename=koobd-ca.crt"
    </Files>
</Directory>
