# Photos and videos sent in private classroom messages: never served
# directly. message_media.php checks who is asking and sends the file.
<Directory /var/www/html/uploads/private-messages>
    Require all denied
</Directory>

<Directory /var/www/html/css/img>
    AllowOverride FileInfo
</Directory>

# Caching for slower devices and connections. Pages link their CSS, scripts
# and story art with a version (?v=<file time>, see koobdAsset in auth.php),
# which changes whenever the file does - so a versioned file can be kept for a
# year without asking the server again. Unversioned art and media are kept for
# a day; PHP pages are never cached by this.
<FilesMatch "\.(css|js|png|jpe?g|gif|webp|svg|ico|mp3|wav|ogg|mp4|webm|woff2?|ttf)$">
    <If "%{QUERY_STRING} =~ /(^|&)v=/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </If>
    <ElseIf "%{REQUEST_URI} !~ m#\.(css|js)$#">
        Header set Cache-Control "public, max-age=86400"
    </ElseIf>
    <Else>
        # Styles and scripts without a version (such as one stylesheet
        # importing another): always rechecked, so a change shows at once.
        Header set Cache-Control "no-cache"
    </Else>
</FilesMatch>
