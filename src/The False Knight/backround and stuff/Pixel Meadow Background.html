<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Meadow Background</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#2b2038;--panel:#3a2c4a;--ink:#f4e9d3;--dim:#b9a8c9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:10px/1.8 'Press Start 2P',ui-monospace,monospace;padding:20px 16px 40px}
main{max-width:900px;margin:0 auto}
h1{font-size:18px;margin:0 0 6px}
p{color:var(--dim);margin:0 0 18px}
canvas{image-rendering:pixelated;display:block;width:100%;height:auto}
.ctl{display:flex;gap:8px;margin:10px 0 22px}
button{font:inherit;background:var(--ink);color:var(--bg);border:0;padding:12px 14px;flex:1;cursor:pointer;touch-action:none}
button:active{background:#5fbf4a}
#layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
figure{margin:0;background:var(--panel);padding:10px;color:var(--dim)}
figure canvas{margin-bottom:8px}
</style>
</head>
<body>
<main>
<h1>Pixel Meadow</h1>
<p>240x135 pixels, 5 parallax layers. Arrows or A/D to scroll.</p>
<canvas id="view" width="240" height="135"></canvas>
<div class="ctl"><button id="bl">Left</button><button id="br">Right</button></div>
<p>Layers (each tiles seamlessly, save any one as an image).</p>
<div id="layers"></div>
</main>
<script>
const W=240,H=135,GY=108,O='#3b2a3f',OT='#3a2218';
const px=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
const blob=(g,x,y,w,h,c)=>{px(g,x+1,y,w-2,h,c);px(g,x,y+1,w,h-2,c)};
const blobO=(g,x,y,w,h,c)=>{blob(g,x-1,y-1,w+2,h+2,O);blob(g,x,y,w,h,c)};
const R=s=>()=>(s=s*16807%2147483647)/2147483647;
const box=document.getElementById('layers');
function mk(name){const c=document.createElement('canvas');c.width=W;c.height=H;const f=document.createElement('figure');f.append(c,name);box.append(f);return c}

const sky=mk('Sky'),sg=sky.getContext('2d');
['#8fd0ee','#9fd8f1','#afe0f4','#bfe7f7','#cfeefa','#def4fc'].forEach((c,i)=>px(sg,0,i*20,W,21,c));

const cl=mk('Clouds and raincloud'),cg=cl.getContext('2d');
function cloud(g,x,y,w,a,b){px(g,x+2,y+5,w-4,5,a);px(g,x,y+7,w,3,a);px(g,x+4,y+2,w*.45|0,4,a);px(g,x+(w*.5|0),y,w*.3|0,6,a);px(g,x+2,y+9,w-4,1,b)}
cloud(cg,16,20,38,'#fff','#cfe4f5');cloud(cg,96,34,46,'#fff','#cfe4f5');cloud(cg,196,10,32,'#fff','#cfe4f5');cloud(cg,150,14,36,'#a9b3c3','#8a95a8');

const hh=mk('Hills'),hg=hh.getContext('2d');
function hills(g,base,a1,a2,p,col,hi){for(let x=0;x<W;x++){const t=Math.round(base+a1*Math.sin(2*Math.PI*2*x/W+p)+a2*Math.sin(2*Math.PI*5*x/W+p*2));px(g,x,t,1,GY-t,col);px(g,x,t,1,1,hi)}}
hills(hg,70,10,3,0,'#b4e2bd','#cdeed2');hills(hg,86,8,3,2,'#8fd3a0','#a8dfb4');

const pr=mk('Sprout trees and tulip stones'),pg=pr.getContext('2d');
function tree(x,h){px(pg,x-2,GY-h,5,h,O);px(pg,x-1,GY-h,3,h,'#d49500');px(pg,x+1,GY-h+2,1,h-2,'#a86f00');
  const cy=GY-h-7;blobO(pg,x-9,cy,19,10,'#5fbf4a');px(pg,x-6,cy+2,5,2,'#86d86b');px(pg,x+3,cy+6,6,3,'#3f9a33');
  px(pg,x,cy-5,1,5,'#0a8a0a');px(pg,x-3,cy-6,3,2,'#12e812');px(pg,x+1,cy-7,3,2,'#12e812')}
function stone(x){blobO(pg,x-9,GY-10,18,10,'#7a7a7a');px(pg,x+3,GY-8,5,7,'#5f5f62');px(pg,x-6,GY-8,2,1,'#b0b0b8');
  px(pg,x-8,GY-11,16,3,'#0ee80e');px(pg,x-8,GY-9,3,1,'#0ee80e');px(pg,x,GY-17,1,6,'#1e9a1e');px(pg,x-1,GY-20,3,3,'#e8112d');px(pg,x-3,GY-15,2,1,'#33d633')}
[[22,14],[84,20],[150,11],[214,17]].forEach(a=>tree(...a));stone(52);stone(186);

const gr=mk('Ground, pond and tulips'),gg=gr.getContext('2d');
px(gg,0,GY,W,H-GY,'#b5653a');
const r=R(7);
for(let i=0;i<90;i++){const x=r()*W|0,y=GY+6+(r()*(H-GY-6)|0);px(gg,x,y,2,1,['#8a4a2a','#c9784a'][r()>.5?1:0])}
px(gg,0,GY,W,1,OT);px(gg,0,GY+1,W,1,'#86d86b');px(gg,0,GY+2,W,2,'#5fbf4a');px(gg,0,GY+4,W,1,'#3f9a33');
for(let x=2;x<W;x+=4)px(gg,x,GY+5,2,1,'#3f9a33');
px(gg,111,GY,30,5,'#3a8ef6');px(gg,110,GY,1,5,OT);px(gg,141,GY,1,5,OT);px(gg,111,GY+5,30,1,OT);
px(gg,114,GY+1,7,1,'#a8d4ff');px(gg,128,GY+2,5,1,'#a8d4ff');px(gg,124,GY+3,10,1,'#2a5fa8');
[20,60,100,150,190,222].forEach(x=>{px(gg,x,GY-3,1,3,'#3f9a33');px(gg,x+1,GY-2,1,2,'#3f9a33');px(gg,x-1,GY-2,1,2,'#3f9a33')});
[[8,'#e8112d'],[38,'#ffc400'],[70,'#eeedeb'],[96,'#e8112d'],[160,'#b020ff'],[176,'#ffc400'],[204,'#e8112d'],[232,'#eeedeb']].forEach(([x,c])=>{
  px(gg,x,GY-5,1,5,'#1e9a1e');px(gg,x-1,GY-8,3,3,c);px(gg,x,GY-9,1,1,c);px(gg,x+1,GY-3,2,1,'#33d633')});

const vg=document.getElementById('view').getContext('2d');
const SP=[0,.1,.2,.35,.6,1],LY=[sky,cl,hh,hh,pr,gr];let scroll=0,t=0,dir=0;
function draw(){
  t++;scroll+=dir*1.5+.25;
  vg.drawImage(sky,0,0);
  [[cl,.1],[hh,.2],[pr,.6],[gr,1]].forEach(([c,s])=>{const o=Math.floor(scroll*s)%W;vg.drawImage(c,-o,0);vg.drawImage(c,W-o,0)});
  const ox=Math.floor(scroll*.1)%W;
  for(let k=0;k<5;k++)px(vg,((156+k*6-ox)%W+W)%W,28+((t*2+k*5)%24),1,2,'#4f93e8');
}
setInterval(draw,1000/30);
const K={ArrowLeft:-1,a:-1,ArrowRight:1,d:1};
addEventListener('keydown',e=>{if(K[e.key]){dir=K[e.key];e.preventDefault()}});
addEventListener('keyup',e=>{if(K[e.key])dir=0});
[['bl',-1],['br',1]].forEach(([id,d])=>{const b=document.getElementById(id);
  b.addEventListener('pointerdown',()=>dir=d);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>dir=0))});
</script>
</body>
</html>
